# BD GAME — Android starter project

এটি কালো-গোল্ডেন ডিজাইনের Android Studio starter project।

## বর্তমানে যা আছে
- Home screen ও game lobby
- Card, Plane Crash, Boxing, Lucky Spin, Dice এবং Mini Games-এর placeholder
- Demo coin balance ও daily bonus button
- Demo coin packs (কোনো পেমেন্ট নয়)
- Profile screen-এ mobile number field
- Offline prototype UI

## গুরুত্বপূর্ণ সীমাবদ্ধতা
- এটি সম্পূর্ণ production-ready game নয়।
- OTP/SMS login, database, admin server, real multiplayer, server-side coin ledger, analytics, privacy policy এবং Play Store release build এখনো যোগ করা হয়নি।
- কোনো real-money payment, betting payout বা withdrawal নেই।
- Coins শুধু demo points; কোনো cash value নেই।
- দৈনিক বোনাস এই prototype-এ app state-এ থাকে; app restart করলে reset হতে পারে। Production-এ server-side daily claim logic লাগবে।

## Android Studio-তে চালানোর নিয়ম
1. কম্পিউটারে Android Studio ইনস্টল করুন।
2. Android Studio থেকে `Open` নির্বাচন করে এই project folder খুলুন।
3. Gradle sync শেষ হতে দিন।
4. Android SDK Platform 35 ইনস্টল করতে হতে পারে।
5. Emulator চালু করুন অথবা USB debugging চালু করা Android ফোন সংযোগ করুন।
6. `Run` চাপুন।

## APK তৈরি
Android Studio-তে `Build > Build APK(s)` ব্যবহার করুন। Play Store-এর জন্য সাধারণত signed Android App Bundle (AAB) দরকার হয়।

## প্রকাশের আগে
Google Play policies, target API requirements, privacy/data safety forms, app content rating, account verification এবং প্রযোজ্য স্থানীয় আইন যাচাই করুন।
